server {
    listen 80;

    # Audio uploads can be large; inference on long files is slow.
    client_max_body_size 200m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API path (used when the page's API URL field is empty);
    # forwards to the sensevoice service on the compose network.
    location /api/ {
        proxy_pass http://sensevoice:3110/;
        proxy_set_header Host $host;
    }
}
