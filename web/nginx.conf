server {
    listen 80;

    # Audio uploads can be large; inference on long files is slow.
    client_max_body_size 200m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Docker's embedded DNS. Resolving through a variable re-resolves per
    # request, so a restarted sensevoice container with a new IP does not
    # leave nginx dialing a stale address until it is reloaded.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API path (used when the page's API URL field is empty);
    # forwards to the sensevoice service on the compose network. No URI part
    # on proxy_pass: the API mounts its routes under /api/, so the prefix
    # must reach it intact.
    location /api/ {
        set $sensevoice_api http://sensevoice:5000;
        proxy_pass $sensevoice_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
