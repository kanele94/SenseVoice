name: sense

services:
  sensevoice:
    container_name: sensevoice
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MODELSCOPE_CACHE: /models
      SENSEVOICE_DEVICE: cpu
    volumes:
      # Pre-fetched ModelScope cache. A bind mount, not a named volume: the
      # contents must be the ones on disk here, and a named volume would only
      # ever be seeded from the image while still empty.
      - ./models:/models
    restart: on-failure:5
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  # Vite STT website (web/) served by nginx; /api is proxied to the
  # sensevoice service. Start with: docker compose --profile webui up webui
  webui:
    container_name: sensevoice-webui
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - sensevoice
    ports:
      - "3110:80"
    restart: on-failure:5
    logging:
      options:
        max-size: "5m"
        max-file: "3"
